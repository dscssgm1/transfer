# 单文件上限严格小于 2 GiB（2147483648 字节）。
# multipart 临时文件目录由 MultipartConfig 按 transfer.storage 的绝对路径设置，
# 避免默认写入 /tmp 占满系统分区。
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:2147483647B}
# 请求体上限需略大于文件上限，为 multipart 边界和表头留出空间；
# 超出文件上限的请求仍会被业务层按字节计数拒绝并返回 413。
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:2151677952B}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/transfer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:transfer}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:transfer}
spring.flyway.enabled=true
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# readiness 组默认只含 readinessState，数据库故障时仍会报告 UP，
# 导致容器健康检查和前端指示灯都检测不到数据库中断。显式纳入 db。
management.endpoint.health.group.readiness.include=readinessState,db
transfer.storage=${TRANSFER_STORAGE:./data}
transfer.max-file-size=${TRANSFER_MAX_FILE_SIZE:2147483647}
# 全站共享存储配额，默认 40 GiB。超出后拒绝上传（HTTP 507）。
transfer.capacity-bytes=${TRANSFER_CAPACITY_BYTES:42949672960}
transfer.expiry=${TRANSFER_EXPIRY:20m}
transfer.cleanup-interval=${TRANSFER_CLEANUP_INTERVAL:1m}
transfer.owner-secret=${TRANSFER_OWNER_SECRET:change-me-in-production}
# 下载票据有效期。票据使用 transfer.owner-secret 做 HMAC，无需额外密钥；
# 修改 owner-secret 会同时让旧票据和浏览器 owner Cookie 失效。
transfer.download-ticket-ttl=${TRANSFER_DOWNLOAD_TICKET_TTL:60s}
transfer.cookie-secure=${TRANSFER_COOKIE_SECURE:false}
# 管理员账号只来自环境变量，不写入数据库。用户名或密码为空时管理员功能未启用。
transfer.admin.username=${TRANSFER_ADMIN_USERNAME:${ADMIN_USERNAME:}}
transfer.admin.password=${TRANSFER_ADMIN_PASSWORD:${ADMIN_PASSWORD:}}
# JWT 有效期。修改管理员用户名/密码会让已签发的 JWT 立即失效。
transfer.admin.session-ttl=${TRANSFER_ADMIN_SESSION_TTL:8h}
# 建议显式设置至少 32 字节的随机密钥；留空时由管理员用户名和密码派生。
transfer.admin.jwt-secret=${TRANSFER_ADMIN_JWT_SECRET:}
transfer.admin.login-max-attempts=${TRANSFER_ADMIN_LOGIN_MAX_ATTEMPTS:5}
transfer.admin.login-window=${TRANSFER_ADMIN_LOGIN_WINDOW:15m}
# 普通账号 JWT 有效期；管理员仍使用 transfer.admin.session-ttl。
transfer.auth.session-ttl=${TRANSFER_AUTH_SESSION_TTL:8h}
