services:
  nginx:
    build: ./nginx          # 指向包含 Dockerfile 的目录
    container_name: my-nginx
    ports:
      - "8080:80"
    depends_on:
      - mysql               # 仅控制启动顺序，不代表 MySQL 就绪
    networks:
      - app-net

  mysql:
    image: mysql:8.0        # 直接使用官方镜像，无需 build
    container_name: my-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123543
      MYSQL_DATABASE: mydb
      MYSQL_USER: transfer
      MYSQL_PASSWORD: tranfer123543
    volumes:
      - mysql-data:/var/lib/mysql   # 数据持久化，防止容器删除后数据丢失
      # 如果有初始化 SQL，取消下面注释
      # - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-net

volumes:
  mysql-data:

networks:
  app-net:
    driver: bridge