# 后端 Spring Boot 运行在宿主机，容器通过 host.docker.internal 访问。
upstream transfer_api {
    server host.docker.internal:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 单文件上限约 2 GiB，请求体略放宽以容纳 multipart 边界；
    # 真正的字节上限仍由后端校验。
    client_max_body_size 2050m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的静态资源可长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端健康检查，供页面页脚指示灯使用
    location = /actuator/health/readiness {
        proxy_pass http://transfer_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 文件传输接口：大文件直传，关闭请求缓冲并放宽超时
    location /api/ {
        proxy_pass http://transfer_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # index.html 不缓存，替换前端文件后刷新即可生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 单页应用：hash 路由不会命中此规则，但保留兜底以免直接访问子路径时 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
